services:
  - type: web
    name: water-supply-management-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.vercel
    dockerContext: .
    healthCheckPath: /Account/Login
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: WATER_SUPPLY_DEMO_DATA
        value: "true"
